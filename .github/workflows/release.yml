name: Release binaries

# Builds the native engine for each supported platform and attaches it to the GitHub release of the tag.
# `fullgpu render` downloads the binary that matches the npm package version, so users don't need Rust.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: fullgpu-render-windows-x64.exe
            built: fullgpu-render.exe
          - os: ubuntu-latest
            asset: fullgpu-render-linux-x64
            built: fullgpu-render
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo build --release --locked
        working-directory: native
      - name: Smoke test (prints usage without a GPU)
        run: |
          set +e
          out=$(native/target/release/${{ matrix.built }} 2>&1)
          echo "$out"
          echo "$out" | grep -q "usage: fullgpu-render"
      - run: mkdir -p dist && cp native/target/release/${{ matrix.built }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
